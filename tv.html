<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Tabule - Kostky</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 3rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .scoreboard {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background: #1e293b;
            border: 3px solid #334155;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
        }
        .name {
            font-size: 2rem;
            font-weight: bold;
            color: #94a3b8;
            margin-bottom: 15px;
            word-break: break-word;
        }
        .score {
            font-size: 5.5rem;
            font-weight: 900;
            color: #38bdf8;
            line-height: 1;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <h1>VÝSLEDKOVÁ TABULE</h1>
    <div class="scoreboard" id="board">Načítání výsledků...</div>

    <script>
        async function fetchScore() {
            try {
                const res = await fetch('https://api.myjson.online/v1/records/48318991-8636-4184-a134-8c887cdbe3e1');
                if (!res.ok) return;
                const json = await res.json();
                const players = json.data.players;
                
                if (players && players.length > 0) {
                    const board = document.getElementById('board');
                    board.innerHTML = players.map(p => `
                        <div class="card">
                            <div class="name">${p.name}</div>
                            <div class="score">${p.score}</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.log("Čekání na data...");
            }
        }

        // Aktualizuje TV každou 1 sekundu
        setInterval(fetchScore, 1000);
        fetchScore();
    </script>
</body>
</html>

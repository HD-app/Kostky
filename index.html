<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovládání - Kostky</title>
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--accent); }
        
        google-cast-launcher {
            --connected-color: var(--accent);
            --disconnected-color: #94a3b8;
            width: 38px;
            height: 38px;
            cursor: pointer;
        }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            position: relative;
        }
        .name-input {
            background: transparent; border: none; border-bottom: 2px solid var(--accent);
            color: var(--text); font-size: 1.2rem; font-weight: bold; width: 80%; padding: 4px;
        }
        .score { font-size: 2.8rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        .row { display: flex; gap: 8px; }
        .score-input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text); padding: 10px; font-size: 1.1rem; text-align: center;
        }
        button {
            background: var(--accent); color: var(--bg); border: none;
            padding: 10px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1.1rem;
        }
        .btn-delete {
            position: absolute; top: 10px; right: 10px; background: none;
            color: #ef4444; font-size: 1.2rem; padding: 5px;
        }
        .controls { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-sec { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 12px; }
        .btn-danger { color: #f87171; border-color: #7f1d1d; }
        .status { text-align: center; font-size: 0.85rem; color: #38bdf8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎮 Ovládání kostky</h2>
        <google-cast-launcher id="castbutton"></google-cast-launcher>
    </div>

    <div id="app"></div>

    <div class="controls">
        <button class="btn-sec" onclick="addPlayer()">+ Přidat hráče</button>
        <button class="btn-sec btn-danger" onclick="resetScores()">Vynulovat skóre</button>
    </div>
    <div class="status" id="status">Připojování k Firebase...</div>

    <script>
        const FIREBASE_URL = 'https://klubac-laser-game-default-rtdb.europe-west1.firebasedatabase.app/hra.json';

        let players = [
            { id: 1, name: "Hráč 1", score: 0 },
            { id: 2, name: "Hráč 2", score: 0 }
        ];

        window['__onGCastApiAvailable'] = function(isAvailable) {
            if (isAvailable) {
                cast.framework.CastContext.getInstance().setOptions({
                    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCORED
                });
            }
        };

        async function loadInitial() {
            try {
                const res = await fetch(FIREBASE_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data)) {
                        players = data;
                    }
                }
            } catch (e) {
                console.error("Chyba při načítání", e);
            }
            render();
            document.getElementById('status').innerText = 'Připojeno k Firebase 🔥';
        }

        async function sync() {
            render();
            document.getElementById('status').innerText = 'Ukládám do cloudu...';
            try {
                await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(players)
                });
                document.getElementById('status').innerText = 'Uloženo ✅';
            } catch (e) {
                document.getElementById('status').innerText = 'Chyba ukládání ❌';
            }
        }

        function render() {
            document.getElementById('app').innerHTML = players.map(p => `
                <div class="card">
                    ${players.length > 2 ? `<button class="btn-delete" onclick="removePlayer(${p.id})">&times;</button>` : ''}
                    <input type="text" class="name-input" value="${p.name}" onchange="updateName(${p.id}, this.value)">
                    <div class="score">${p.score}</div>
                    <form class="row" onsubmit="addPts(event, ${p.id})">
                        <input type="number" class="score-input" id="in-${p.id}" placeholder="+ body">
                        <button type="submit">+</button>
                    </form>
                </div>
            `).join('');
        }

        function addPts(e, id) {
            e.preventDefault();
            const inp = document.getElementById(`in-${id}`);
            const pts = parseInt(inp.value, 10);
            if (!isNaN(pts)) {
                players.find(p => p.id === id).score += pts;
                inp.value = '';
                sync();
            }
        }

        function updateName(id, val) {
            players.find(p => p.id === id).name = val || `Hráč ${id}`;
            sync();
        }

        function addPlayer() {
            players.push({ id: Date.now(), name: `Hráč ${players.length + 1}`, score: 0 });
            sync();
        }

        function removePlayer(id) {
            if (players.length > 2) {
                players = players.filter(p => p.id !== id);
                sync();
            }
        }

        function resetScores() {
            if (confirm("Opravdu vynulovat skóre všem?")) {
                players.forEach(p => p.score = 0);
                sync();
            }
        }

        loadInitial();
    </script>
</body>
</html>
